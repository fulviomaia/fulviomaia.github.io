<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fulvio Maia | Audiovisual & Educação</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #020617, #0f172a);
      color: var(--text);
      line-height: 1.6;
    }
    a { text-decoration: none; }
    header {
      padding: 4rem 2rem;
      text-align: center;
    }
    header h1 {
      font-size: 3rem;
      font-weight: 700;
    }
    header p {
      color: var(--muted);
      max-width: 600px;
      margin: 1rem auto 0;
      font-size: 1.1rem;
    }
    section {
      padding: 3rem 2rem;
      max-width: 1100px;
      margin: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .card-link { display: block; }
    .card {
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform .3s ease, box-shadow .3s ease;
      height: 100%;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .card h3 {
      margin-bottom: .5rem;
      color: var(--text);
    }
    .card p {
      color: var(--muted);
      font-size: .95rem;
    }
    footer {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: .9rem;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Fulvio Maia</h1>
    <p>Audiovisual, educação e projetos criativos que usam imagem, som e narrativa para transformar conhecimento.</p>
  </header>

  <section>
    <div class="grid">
      <a href="#" class="card-link"><div class="card">$1</div></a>
      <a href="#" class="card-link"><div class="card">$1</div></a>
      <a href="#" class="card-link"><div class="card">$1</div></a>
      <a href="#" class="card-link"><div class="card">$1</div></a>
      <a href="#" class="card-link"><div class="card">$1</div></a>
      <a href="#" class="card-link"><div class="card">$1</div></a>
    </div>
  </section>

  

  <section>
    <h2>Contato</h2>
    <p>📩 <a href="mailto:contato@fulviomaia.com">contato@fulviomaia.com</a></p>
    <p>🔗 <a href="https://linkedin.com" target="_blank">LinkedIn</a></p>
  </section>

  <footer>
    © 2025 Fulvio Maia • Hospedado no GitHub Pages
  </footer>

</body>
</html>
